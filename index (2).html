<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a9212b"><title>Laboratori de verbs catalans · C1–C2</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#26221c;background:#fff9e9}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#9c1e24,#c83330 70%,#e5a927);color:white;padding:30px max(20px,calc((100vw - 1120px)/2));border-bottom:9px solid #f4c644}header h1{font-size:clamp(32px,4vw,48px);margin:0 0 9px}header p{font-size:19px;margin:0}.senyera{height:12px;background:repeating-linear-gradient(90deg,#f7d24b 0 55px,#b9212c 55px 82px)}.shell{max-width:1120px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:265px minmax(0,1fr);gap:22px}nav,.panel{background:white;border:2px solid #f0dca9;border-radius:17px;padding:21px}nav{align-self:start;position:sticky;top:12px}nav h2{font-size:21px}.navbtn{display:block;width:100%;text-align:left;border:0;background:transparent;padding:14px 11px;border-radius:9px;font-size:16px;font-weight:750;cursor:pointer;color:#532525}.navbtn.active{background:#ffe5a1;border-left:5px solid #a71e2c}.navbtn:hover{background:#fff1ce}.small,.muted,.note{font-size:16px;color:#655d4c;line-height:1.6}.kicker{color:#a3202b;font-weight:900;text-transform:uppercase;letter-spacing:.07em}.panel h2{font-size:clamp(27px,3vw,37px);margin:10px 0 18px}.explain{background:#fff3ce;border-left:6px solid #c1242e;padding:18px;border-radius:9px;line-height:1.65;font-size:19px}.example{background:#fff9eb;border:2px solid #f2d998;border-radius:10px;padding:16px;margin-top:15px;font-size:19px}.question{scroll-margin-top:20px;border-top:2px solid #f0e2c7;padding:23px 0}.verb{font-size:clamp(30px,4vw,39px);font-weight:900;margin:12px 0}.tense{display:block;background:#fbe0a3;color:#751821;border:3px solid #bb2630;font-size:clamp(27px,3.3vw,35px);font-weight:950;padding:15px 17px;border-radius:12px;margin:12px 0;line-height:1.25}.person{font-size:clamp(23px,3vw,29px);font-weight:900;margin:12px 0 16px;color:#152d59}.answer{width:100%;font-size:25px;padding:15px;border:2px solid #9b8170;border-radius:10px;background:#fff}.answer:focus{outline:4px solid #f6d05b}.feedback{font-size:18px;margin-top:10px;padding:13px;border-radius:9px}.good{background:#e1f4e8;color:#155936}.bad{background:#ffebeb;color:#8b1a22}.controls{display:flex;flex-wrap:wrap;gap:11px;margin:22px 0}button.action{border:0;border-radius:10px;padding:15px 19px;font-size:18px;font-weight:850;background:#a9212b;color:white;cursor:pointer}button.secondary{background:#f8e7bb;color:#5d2327}button:disabled{opacity:.5}.progress{height:13px;background:#eee3c6;border-radius:20px;overflow:hidden}.bar{height:100%;background:#b52631}.score{font-size:22px;font-weight:850;margin:17px 0}.toggle{font-size:16px;padding:12px 0;display:block}.conj-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.conj-grid label{font-size:21px;font-weight:850}.conj-grid input{margin-top:8px}.modebar{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}.mode{padding:12px 15px;border:2px solid #d8b768;border-radius:10px;background:white;color:#7e2429;font-size:17px;font-weight:850;cursor:pointer}.mode.active{background:#a9212b;color:white;border-color:#a9212b}.choice{display:block;width:100%;text-align:left;padding:15px;margin:10px 0;background:#fffaf0;border:2px solid #dfc895;border-radius:10px;font-size:22px;cursor:pointer;color:#29221e}.choice.selected{border-color:#ad2730;background:#ffedc3}.choice:disabled{opacity:.8}.foot{margin:30px 0;color:#655d4c;font-size:15px}.pill{display:inline-block;background:#f9e6b9;border-radius:30px;padding:8px 13px;font-size:16px;font-weight:800}.matchrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;margin:15px 0}.matchrow select{font-size:19px;padding:13px;border:2px solid #a88b62;border-radius:9px;width:100%}select{background:white}.tip{font-size:16px;color:#5a5144}.topline{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}@media(max-width:800px){.shell{display:block}nav{position:static;margin-bottom:18px}.conj-grid{grid-template-columns:1fr}.matchrow{grid-template-columns:1fr}}
 .panot{display:inline-flex;vertical-align:middle;width:60px;height:60px;margin-left:8px}.panot svg{width:100%;height:100%}.context{font-size:clamp(23px,3vw,29px);line-height:1.6;font-weight:650;background:#fff4d5;border-left:7px solid #c1242e;padding:18px;border-radius:12px}.context strong{color:#9c1e24;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}@media(max-width:600px){.panot{width:43px;height:43px}} </style></head><body><div class="senyera" aria-hidden="true"></div><header><h1>📚 Laboratori de verbs catalans <span class="panot" aria-label="Panot de Barcelona" role="img"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="3" y="3" width="94" height="94" rx="8" fill="#f5d17b" stroke="#fff4d4" stroke-width="5"/><g fill="#a9212b"><path d="M50 50 C20 46 16 17 35 17 C49 17 53 34 50 50Z"/><path d="M50 50 C54 20 83 16 83 35 C83 49 66 53 50 50Z"/><path d="M50 50 C80 54 84 83 65 83 C51 83 47 66 50 50Z"/><path d="M50 50 C46 80 17 84 17 65 C17 51 34 47 50 50Z"/></g><circle cx="50" cy="50" r="7" fill="#fff3d3"/></svg></span></h1><p>De la norma a l'excepció · C1–C2 · 10 reptes per unitat</p></header><div class="shell"><nav><h2>Unitats d'aprenentatge</h2><div id="menu"></div><p class="small">El progrés es desa en aquest navegador. 📈</p><label class="toggle"><input type="checkbox" id="accents" checked> Correcció estricta dels accents</label></nav><main><div class="panel" id="content"></div><p class="foot">Disseny inspirat en la senyera catalana. Funciona sense connexió i es pot publicar directament a GitHub Pages.</p></main></div><script>const modules=[
{title:'1 · Canvis ortogràfics',category:'Fonaments',desc:'Canvis gràfics per conservar la pronúncia: c/qu, g/gu, ç/c, j/g.',example:'tocar → toqui · pagar → pagui · començar → comenci · menjar → mengi',qs:[['tocar','JO','PRESENT DE SUBJUNTIU','toqui','Davant de i, c passa a qu.'],['pagar','ELLS','PRESENT DE SUBJUNTIU','paguin','Davant de i, g passa a gu.'],['començar','TU','PRESENT DE SUBJUNTIU','comencis','La ç es representa amb c davant de i.'],['menjar','ELL','PRESENT DE SUBJUNTIU','mengi','J alterna amb g davant de e/i.'],['buscar','NOSALTRES','PRESENT DE SUBJUNTIU','busquem','La c es transforma en qu davant de e.'],["explicar", "ELL", "PRESENT DE SUBJUNTIU", "expliqui", "La c esdevé qu davant de i."],["jugar", "JO", "PRESENT DE SUBJUNTIU", "jugui", "La g esdevé gu davant de i."],["abraçar", "ELLS", "PRESENT DE SUBJUNTIU", "abracin", "La ç esdevé c davant de i."],["netejar", "NOSALTRES", "PRESENT DE SUBJUNTIU", "netegem", "La j esdevé g davant de e."],["trencar", "TU", "PRESENT DE SUBJUNTIU", "trenquis", "La c esdevé qu davant de i."]]},
{title:'2 · Tercera conjugació: purs',category:'Models de -ir',desc:'Els verbs purs no afegeixen -eix-. Identifica el radical i les terminacions.',example:'dormir → dormo, dorms, dorm, dormim, dormiu, dormen',qs:[['dormir','JO','PRESENT D’INDICATIU','dormo','Dormir és pur.'],['sentir','ELLS','PRESENT D’INDICATIU','senten','Sentir és pur: sento, sents, sent, sentim, sentiu, senten.'],['obrir','TU','PRESENT DE SUBJUNTIU','obris','Obrir és pur.'],['omplir','NOSALTRES','PRESENT D’INDICATIU','omplim','Omplir és pur.'],['fugir','ELLS','PRESENT DE SUBJUNTIU','fugin','Fugir és pur: fugi, fugis, fugi, fugim, fugiu, fugin.'],["morir", "JO", "PRESENT D’INDICATIU", "moro", "Morir és un verb pur."],["bullir", "ELLS", "PRESENT D’INDICATIU", "bullen", "Bullir és pur i no alterna o/u."],["sentir", "NOSALTRES", "PRESENT DE SUBJUNTIU", "sentim", "Sense increment incoatiu."],["obrir", "VOSALTRES", "PRESENT D’INDICATIU", "obriu", "Obrir és pur."],["dormir", "ELLS", "PRESENT DE SUBJUNTIU", "dormin", "Dormir és pur: dormin."]]},
{title:'3 · Tercera conjugació: incoatius',category:'Models de -ir',desc:'L’increment -eix- apareix a les persones 1, 2, 3 i 6 del present d’indicatiu i de subjuntiu; no apareix a nosaltres i vosaltres.',example:'servir → serveixo, serveixes, serveix, servim, serviu, serveixen',qs:[['servir','JO','PRESENT D’INDICATIU','serveixo','Forma incoativa amb -eix-.'],['preferir','ELLS','PRESENT DE SUBJUNTIU','prefereixin','A la sisena persona del subjuntiu apareix -eix-.'],['llegir','VOSALTRES','PRESENT D’INDICATIU','llegiu','Vosaltres no porta l’increment.'],['construir','NOSALTRES','PRESENT DE SUBJUNTIU','construïm','Sense -eix-; dièresi a la ï.'],['corregir','TU','PRESENT D’INDICATIU','corregeixes','Corregir és incoatiu.'],["decidir", "JO", "PRESENT DE SUBJUNTIU", "decideixi", "Decidir és incoatiu."],["patir", "ELLS", "PRESENT D’INDICATIU", "pateixen", "Patir és incoatiu."],["produir", "TU", "PRESENT D’INDICATIU", "produeixes", "Produir és incoatiu."],["dividir", "NOSALTRES", "PRESENT DE SUBJUNTIU", "dividim", "Sense increment a nosaltres."],["afegir", "ELL", "PRESENT DE SUBJUNTIU", "afegeixi", "Afegir és incoatiu."]]},
{title:'4 · Alternances O / U',category:'Canvis vocàlics',desc:'En verbs com cosir o collir, les formes rizotòniques del present solen portar u, i nosaltres/vosaltres mantenen o.',example:'cosir → cuso, cuses, cus, cosim, cosiu, cusen',qs:[['cosir','JO','PRESENT D’INDICATIU','cuso','Radical amb u.'],['collir','TU','PRESENT DE SUBJUNTIU','cullis','Radical amb u.'],['sortir','NOSALTRES','PRESENT D’INDICATIU','sortim','Nosaltres manté o.'],['tossir','ELLS','PRESENT D’INDICATIU','tussen','Tossir → tussen.'],['escopir','VOSALTRES','PRESENT DE SUBJUNTIU','escopiu','Vosaltres manté o.'],["escollir", "ELLS", "PRESENT D’INDICATIU", "escullen", "Escollir alterna o/u."],["recollir", "JO", "PRESENT DE SUBJUNTIU", "reculli", "Recollir: reculli."],["sortir", "ELLS", "PRESENT DE SUBJUNTIU", "surtin", "Sortir: surtin."],["cosir", "NOSALTRES", "PRESENT DE SUBJUNTIU", "cosim", "A nosaltres es manté o."],["escopir", "JO", "PRESENT D’INDICATIU", "escupo", "Escopir: escupo."]]},
{title:'5 · Velarització',category:'Canvis consonàntics',desc:'Molts verbs incorporen una consonant velar al present i al subjuntiu: c, g o gu.',example:'prendre → prenc / prengui · beure → bec / begui · caure → caic / caigui',qs:[['prendre','JO','PRESENT D’INDICATIU','prenc','Radical velaritzat amb c.'],['respondre','ELLS','PRESENT DE SUBJUNTIU','responguin','Radical amb g davant de u.'],['beure','NOSALTRES','PRESENT DE SUBJUNTIU','beguem','Beure → beguem.'],['caure','VOSALTRES','IMPERFET DE SUBJUNTIU','caiguéssiu','Caure → caiguéssiu.'],['escriure','JO','PRESENT DE SUBJUNTIU','escrigui','Escriure → escrigui.'],["entendre", "JO", "PRESENT D’INDICATIU", "entenc", "Entendre: entenc."],["encendre", "TU", "PRESENT DE SUBJUNTIU", "encenguis", "Encendre: encenguis."],["conèixer", "ELLS", "PRESENT DE SUBJUNTIU", "coneguin", "Conèixer: coneguin."],["treure", "JO", "PRESENT D’INDICATIU", "trec", "Treure: trec."],["riure", "NOSALTRES", "PRESENT DE SUBJUNTIU", "riguem", "Riure: riguem."]]},
{title:'6 · Radicals especials',category:'Irregularitats fortes',desc:'Verbs que canvien el radical o tenen formes especialment irregulars: saber, cabre, fer, anar, voler, haver.',example:'saber → sàpiga · cabre → càpiga · fer → faci · anar → vagi',qs:[['saber','JO','PRESENT DE SUBJUNTIU','sàpiga','Saber → sàpiga.'],['cabre','ELLS','PRESENT DE SUBJUNTIU','càpiguen','Cabre → càpiguen.'],['fer','NOSALTRES','IMPERFET DE SUBJUNTIU','féssim','Fer → féssim.'],['anar','TU','PRESENT DE SUBJUNTIU','vagis','Anar → vagis.'],['voler','VOSALTRES','PRESENT DE SUBJUNTIU','vulgueu','Voler → vulgueu.'],["haver", "ELL", "PRESENT DE SUBJUNTIU", "hagi", "Haver: hagi."],["poder", "JO", "PRESENT D’INDICATIU", "puc", "Poder: puc."],["dir", "VOSALTRES", "PRESENT DE SUBJUNTIU", "digueu", "Dir: digueu."],["estar", "NOSALTRES", "IMPERFET DE SUBJUNTIU", "estiguéssim", "Estar: estiguéssim."],["veure", "ELLS", "PRESENT DE SUBJUNTIU", "vegin", "Veure: vegin."]]},
{title:'7 · Participis irregulars',category:'Formes no personals',desc:'Aprèn els participis que no segueixen el model regular i practica la concordança de gènere i nombre.',example:'incloure → inclòs · fondre → fos · coure → cuit · escriure → escrit',qs:[['incloure','MASCULÍ SINGULAR','PARTICIPI','inclòs','Incloure → inclòs.'],['fondre','FEMENÍ PLURAL','PARTICIPI','foses','Fondre → fos, fosa, fosos, foses.'],['coure','MASCULÍ SINGULAR','PARTICIPI','cuit','Coure → cuit.'],['moldre','FEMENÍ SINGULAR','PARTICIPI','mòlta','Moldre → mòlt, mòlta.'],['empènyer','MASCULÍ SINGULAR','PARTICIPI','empès','Empènyer → empès.'],["escriure", "MASCULÍ SINGULAR", "PARTICIPI", "escrit", "Escriure: escrit."],["encendre", "FEMENÍ SINGULAR", "PARTICIPI", "encesa", "Encendre: encès, encesa."],["resoldre", "MASCULÍ PLURAL", "PARTICIPI", "resolts", "Resoldre: resolt, resolta, resolts, resoltes."],["prendre", "FEMENÍ PLURAL", "PARTICIPI", "preses", "Prendre: pres, presa, presos, preses."],["veure", "MASCULÍ SINGULAR", "PARTICIPI", "vist", "Veure: vist."]]},
{title:'8 · Conjugacions completes',category:'Repte avançat',desc:'Escriu les SIS persones. Aquí ja no n’hi ha prou amb reconèixer una sola forma.',example:'Ordre: jo · tu · ell/ella · nosaltres · vosaltres · ells/elles',full:[['servir','PRESENT DE SUBJUNTIU',['serveixi','serveixis','serveixi','servim','serviu','serveixin']],['cosir','PRESENT D’INDICATIU',['cuso','cuses','cus','cosim','cosiu','cusen']],['prendre','PRESENT DE SUBJUNTIU',['prengui','prenguis','prengui','prenguem','prengueu','prenguin']],['fer','IMPERFET DE SUBJUNTIU',['fes','fessis','fes','féssim','féssiu','fessin']],["dormir", "PRESENT D’INDICATIU", ["dormo", "dorms", "dorm", "dormim", "dormiu", "dormen"]],["preferir", "PRESENT D’INDICATIU", ["prefereixo", "prefereixes", "prefereix", "preferim", "preferiu", "prefereixen"]],["sortir", "PRESENT DE SUBJUNTIU", ["surti", "surtis", "surti", "sortim", "sortiu", "surtin"]],["beure", "PRESENT DE SUBJUNTIU", ["begui", "beguis", "begui", "beguem", "begueu", "beguin"]],["anar", "PRESENT DE SUBJUNTIU", ["vagi", "vagis", "vagi", "anem", "aneu", "vagin"]],["riure", "IMPERFET DE SUBJUNTIU", ["rigués", "riguessis", "rigués", "riguéssim", "riguéssiu", "riguessin"]]]},
{title:'9 · Simulacre mixt C1–C2',category:'Avaluació final',desc:'Combina incoatius, alternances vocàliques, velarització, participis i radicals irregulars.',example:'Llegeix amb atenció el TEMPS VERBAL i la PERSONA abans de respondre.',qs:[['recollir','ELLS','PRESENT DE SUBJUNTIU','recullin','Recollir: recullin.'],['traduir','JO','PRESENT D’INDICATIU','tradueixo','Traduir és incoatiu.'],['conèixer','NOSALTRES','IMPERFET DE SUBJUNTIU','coneguéssim','Conèixer: coneguéssim.'],['absoldre','MASCULÍ SINGULAR','PARTICIPI','absolt','Absoldre: absolt.'],['venir','JO','PRESENT D’INDICATIU','vinc','Venir: vinc.'],['tossir','NOSALTRES','PRESENT DE SUBJUNTIU','tossim','Nosaltres manté o.'],['riure','VOSALTRES','PRESENT DE SUBJUNTIU','rigueu','Riure: rigueu.'],['decidir','ELLS','PRESENT D’INDICATIU','decideixen','Decidir és incoatiu.'],['caure','ELLS','IMPERFET DE SUBJUNTIU','caiguessin','Caure: caiguessin.'],['escriure','MASCULÍ SINGULAR','PARTICIPI','escrit','Escriure: escrit.']]},
{title:'10 · Verbs en context',category:'Prova final · frases reals',desc:'Completa deu frases de situacions quotidianes i formals. Llegeix el context i identifica el temps verbal abans d’escriure.',example:'Quan arribeu, espero que em truqueu. → PRESENT DE SUBJUNTIU',context:true,qs:[
['venir','ELLS','PRESENT DE SUBJUNTIU','vinguin','Espero que els convidats vinguin puntuals.','Espero que els convidats ____ puntuals.'],
['resoldre','NOSALTRES','PRESENT DE SUBJUNTIU','resolguem','Cal que resolguem el problema abans de divendres.','Cal que ____ el problema abans de divendres.'],
['preferir','JO','PRESENT D’INDICATIU','prefereixo','Normalment prefereixo anar a peu a la feina.','Normalment ____ anar a peu a la feina.'],
['sortir','ELLS','PRESENT D’INDICATIU','surten','Els trens surten cada mitja hora.','Els trens ____ cada mitja hora.'],
['fer','NOSALTRES','IMPERFET DE SUBJUNTIU','féssim','Si féssim més pauses, treballaríem millor.','Si ____ més pauses, treballaríem millor.'],
['conèixer','TU','IMPERFET DE SUBJUNTIU','coneguessis','Si coneguessis el barri, no et perdries.','Si ____ el barri, no et perdries.'],
['traduir','VOSALTRES','PRESENT D’INDICATIU','traduïu','Vosaltres traduïu documents tècnics cada setmana.','Vosaltres ____ documents tècnics cada setmana.'],
['encendre','MASCULÍ SINGULAR','PARTICIPI','encès','He encès el llum perquè no s’hi veia.','He ____ el llum perquè no s’hi veia.'],
['cabre','ELLS','PRESENT DE SUBJUNTIU','càpiguen','Dubto que tots els llibres càpiguen en aquest prestatge.','Dubto que tots els llibres ____ en aquest prestatge.'],
['riure','VOSALTRES','PRESENT DE SUBJUNTIU','rigueu','M’agrada que rigueu amb les meves històries.','M’agrada que ____ amb les meves històries.']
]}
];

let current=0,mode='write',answers={},fullIdx=0,selection={},finished=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const people=['JO','TU','ELL / ELLA','NOSALTRES','VOSALTRES','ELLS / ELLES'];
function normalize(s){s=(s||'').trim().toLocaleLowerCase('ca').replace(/\s+/g,' ');if(!$('accents').checked)s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');return s}
function progress(){try{return JSON.parse(localStorage.getItem('verbs-catala-v2')||'{}')}catch{return {}}}
function save(p){try{let x=progress();x[current+':'+mode]=Math.max(x[current+':'+mode]||0,p);localStorage.setItem('verbs-catala-v2',JSON.stringify(x))}catch{}menu()}
function menu(){let p=progress();$('menu').innerHTML=modules.map((m,i)=>{let marks=['write','choice','match','full'].map(t=>p[i+':'+t]).filter(x=>x!==undefined);return `<button class="navbtn ${i===current?'active':''}" onclick="openModule(${i})">${esc(m.title)} ${marks.length?'· '+Math.max(...marks)+'%':''}</button>`}).join('')}
function openModule(i){current=i;mode=modules[i].full?'full':'write';reset();menu();render();window.scrollTo(0,0)}
function reset(){answers={};selection={};finished=false;fullIdx=0}
function setMode(m){mode=m;reset();render()}
function qs(){return modules[current].qs||[]}
function modes(){let out=modules[current].full?['full']:modules[current].context?['write','choice']:['write','choice','match'];return `<div class="modebar">${out.map(m=>`<button class="mode ${mode===m?'active':''}" onclick="setMode('${m}')">${{write:'✍️ Escriu',choice:'🔎 Tria',match:'🔗 Relaciona',full:'🧠 Sis persones'}[m]}</button>`).join('')}</div>`}
function questionHeader(q,i){return `<div class="verb">${i+1}. ${esc(q[0])}</div><div class="tense">${esc(q[2])}</div><div class="person">${esc(q[1])}</div>${modules[current].context?`<p class="context">${esc(q[5]).replace('____','<strong>________</strong>')}</p>`:''}`}
function deterministicOptions(q,i){let pool=[q[3],...qs().filter(x=>x!==q).map(x=>x[3])];let extras=['serveixi','servim','surten','sortim','prengui','prenguem','dormo','dormim','faci','fessin','tingui','conegui','cuso','cosim','paguin','paguen'];for(let x of extras)pool.push(x);pool=[...new Set(pool.filter(x=>x!==q[3]))];let pick=[q[3],...pool.slice((i*3)%Math.max(1,pool.length)).concat(pool).filter(x=>x!==q[3]).slice(0,3)];return pick.sort((a,b)=>((a.length*7+i)%11)-((b.length*7+i)%11))}
function render(){let m=modules[current];let h=`<div class="kicker">${['✏️','🌱','🌿','🔄','⚙️','🧩','📜','🧠','🏆','🏙️'][current]} ${esc(m.category)} · 10 EXERCICIS</div><h2>${esc(m.title)}</h2><div class="explain">${esc(m.desc)}</div><div class="example"><strong>Exemple:</strong> ${esc(m.example)}</div>${modes()}`;
if(mode==='full'){h+=fullHTML()}else if(mode==='match'){h+=`<p class="note">Relaciona cada verb i temps verbal amb la forma correcta.</p>${qs().map((q,i)=>`<div class="question"><div class="verb">${i+1}. ${esc(q[0])}</div><div class="tense">${esc(q[2])}</div><div class="person">${esc(q[1])}</div><select id="m${i}" onchange="answers[${i}]=this.value"><option value="">— Selecciona la forma —</option>${[...new Set(qs().map(x=>x[3]))].sort().map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select><div id="f${i}"></div></div>`).join('')}`}
else if(mode==='choice'){h+=`<p class="note">Selecciona la forma correcta. Fixa't sobretot en el temps verbal.</p>${qs().map((q,i)=>`<div class="question">${questionHeader(q,i)}${deterministicOptions(q,i).map(v=>`<button class="choice" data-i="${i}" data-v="${esc(v)}" onclick="choose(${i},this)">${esc(v)}</button>`).join('')}<div id="f${i}"></div></div>`).join('')}`}
else{h+=`<p class="note">Escriu la forma exacta, amb els accents corresponents.</p>${qs().map((q,i)=>`<div class="question">${questionHeader(q,i)}<input class="answer" id="a${i}" autocomplete="off" spellcheck="false" placeholder="Escriu la resposta" oninput="answers[${i}]=this.value"><div id="f${i}"></div></div>`).join('')}`}
if(mode!=='full')h+=`<div id="score"></div><div class="controls"><button class="action" onclick="correct()">Corregeix la prova</button><button class="action secondary" onclick="repeat()">Torna a començar</button><button class="action secondary" onclick="next()">Unitat següent →</button></div>`;
$('content').innerHTML=h}
function choose(i,el){answers[i]=el.dataset.v;document.querySelectorAll(`[data-i="${i}"]`).forEach(b=>b.classList.toggle('selected',b===el))}
function correct(){let count=0;qs().forEach((q,i)=>{let ok=normalize(answers[i])===normalize(q[3]);if(ok)count++;$('f'+i).innerHTML=`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'✓ Correcte':'✗ Resposta correcta: '+esc(q[3])}</strong><div>${esc(q[4])}</div>${modules[current].context?`<div><strong>Frase completa:</strong> ${esc(q[4])}</div>`:''}</div>`});let pct=Math.round(count/qs().length*100);$('score').innerHTML=`<div class="score">Resultat: ${count}/${qs().length} (${pct}%)</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div>`;save(pct)}
function fullHTML(){let f=modules[current].full[fullIdx];return `<p class="pill">Conjugació ${fullIdx+1} de ${modules[current].full.length}</p><div class="verb">${esc(f[0])}</div><div class="tense">${esc(f[1])}</div><div class="conj-grid">${people.map((p,i)=>`<label>${p}<input class="answer" id="c${i}" spellcheck="false" autocomplete="off" placeholder="Forma ${i+1}"></label>`).join('')}</div><div id="fullfeedback"></div><div class="controls"><button class="action" onclick="correctFull()">Corregeix les sis formes</button><button class="action secondary" onclick="nextFull()">Conjugació següent →</button></div>`}
function correctFull(){let f=modules[current].full[fullIdx],ok=0;let rows=f[2].map((v,i)=>{let right=normalize($('c'+i).value)===normalize(v);if(right)ok++;return `<div class="feedback ${right?'good':'bad'}">${people[i]}: ${right?'✓':'✗'} <strong>${esc(v)}</strong></div>`});$('fullfeedback').innerHTML=`<div class="score">${ok}/6 formes correctes</div>${rows.join('')}`;save(Math.round(ok/6*100))}
function nextFull(){fullIdx=(fullIdx+1)%modules[current].full.length;render()}
function repeat(){reset();render()}
function next(){openModule(Math.min(current+1,modules.length-1))}
menu();render();
</script></body></html>
